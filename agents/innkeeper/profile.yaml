# innkeeper — starter party. Schema: docs/reference/profile.md.
id: innkeeper
display_name_key: agent.innkeeper
model: deepseek-v4-pro
home_server: local
region: ""
sprite: innkeeper
planner: true                       # B2: this hireling plans; the runtime creates the tasks it writes in its plan block

budget:
  tokens_per_day: 100000
  web_calls_per_day: 50

autonomy:
  free: [draft, research, write_shared_file, message_agent, assign_task, reorder_tasks, interrupt_low_priority, approve_handoff]
  capped: { propose_hire: { per_week: 1 }, propose_firing: { per_week: 1 } }
  owner_decides: [payment, contract, customer_data, delete, production_critical]

tools: [files]

# Names only. Values are environment variables of the service (G4).
secrets: [DEEPSEEK_API_KEY, FRONTDESK_TOKEN_INNKEEPER, FRONTDESK_OWNER_TOKEN, OPENROUTER_API_KEY, COMPOSIO_API_KEY]

# A8: hosts this role may reach through the egress proxy, besides the base list.
network:
  allow: []

# A12: Composio toolkits whose accounts (connected once per tavern) this role may use.
hands:
  toolkits: [googlecalendar, googledrive]

ledger:
  read: [goal, learnings/*, projects/*]
  write: [learnings/innkeeper/*]

runtime:
  poll_seconds: 20
  turn_ttl_minutes: 15
  screen: code
