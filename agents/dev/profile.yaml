# dev — starter party. Schema: docs/reference/profile.md.
id: dev
display_name_key: agent.dev
model: deepseek-v4-flash
home_server: local
region: ""
sprite: dev

budget:
  tokens_per_day: 150000
  web_calls_per_day: 200

autonomy:
  free: [draft, research, write_shared_file, message_agent, open_branch, open_pr, run_tests]
  capped: { deploy_non_critical: { per_day: 2 } }
  owner_decides: [payment, contract, customer_data, delete, production_critical]

tools: [files]

# Names only. Values are environment variables of the service (G4).
secrets: [DEEPSEEK_API_KEY, FRONTDESK_TOKEN_DEV, OPENROUTER_API_KEY, COMPOSIO_API_KEY]

# A8: hosts this role may reach through the egress proxy, besides the base list.
network:
  allow: [github.com, githubusercontent.com, pypi.org, pythonhosted.org, registry.npmjs.org, proxy.golang.org, sum.golang.org]

# A12: Composio toolkits whose accounts (connected once per tavern) this role may use.
hands:
  toolkits: [github]

ledger:
  read: [goal, learnings/*, projects/*]
  write: [learnings/dev/*]

runtime:
  poll_seconds: 20
  turn_ttl_minutes: 15
  screen: code
