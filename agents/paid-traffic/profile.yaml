# paid-traffic — starter party. Schema: docs/reference/profile.md.
id: paid-traffic
display_name_key: agent.paid-traffic
model: deepseek-v4-flash
home_server: local
region: ""
sprite: paid-traffic

budget:
  tokens_per_day: 150000
  web_calls_per_day: 200

autonomy:
  free: [draft, research, write_shared_file, message_agent]
  capped: { ad_spend_usd: { per_day: 0 } }
  owner_decides: [payment, contract, customer_data, delete, production_critical]

tools: [files]

# Names only. Values are environment variables of the service (G4).
secrets: [DEEPSEEK_API_KEY, FRONTDESK_TOKEN_PAID_TRAFFIC, FRONTDESK_OWNER_TOKEN, OPENROUTER_API_KEY, COMPOSIO_API_KEY]

# A8: hosts this role may reach through the egress proxy, besides the base list.
network:
  allow: []

# A12: Composio toolkits whose accounts (connected once per tavern) this role may use.
hands:
  toolkits: [googleads, metaads]

ledger:
  read: [goal, learnings/*, projects/*]
  write: [learnings/paid-traffic/*]

runtime:
  poll_seconds: 20
  turn_ttl_minutes: 15
  screen: code
