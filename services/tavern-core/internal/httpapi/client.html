<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tavern</title>
<style>
  :root {
    --bg: #16130f; --panel: #211c16; --line: #3a3128; --ink: #e8e0d2;
    --muted: #9b9080; --gold: #c9a24b; --ok: #7fae72; --warn: #c98d4b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .03em; }
  header h1 .dot { color: var(--gold); }
  header .spacer { flex: 1; }
  header input {
    background: #0f0c09; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; width: 280px; font: inherit;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 16px; }
  section { margin-bottom: 22px; }
  h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--muted); margin: 0 0 10px;
  }
  .hint {
    background: var(--panel); border: 1px dashed var(--line); border-radius: 8px;
    padding: 12px 14px; color: var(--muted); font-size: 13px;
  }
  .hint code { color: var(--gold); }

  /* quest bar */
  .quest {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px;
  }
  .quest .top { display: flex; justify-content: space-between; align-items: baseline; }
  .quest .title { font-size: 16px; font-weight: 600; }
  .quest .pct { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
  .quest .bar { height: 12px; background: #0f0c09; border: 1px solid var(--line); border-radius: 7px; margin-top: 10px; overflow: hidden; }
  .quest .fill { height: 100%; background: linear-gradient(90deg, #6b5320, var(--gold)); width: 0; transition: width .4s; }
  .quest .num { color: var(--muted); font-size: 13px; margin-top: 6px; }

  /* party */
  .party { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .agent {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; position: relative;
  }
  .agent .head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .sprite {
    width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center;
    font-weight: 700; font-size: 18px; color: #17120c; border: 1px solid rgba(0,0,0,.4);
    flex: none;
  }
  .agent .name { font-weight: 600; }
  .agent .pending {
    font-size: 11px; color: var(--warn); font-weight: 600;
  }
  .balloon {
    background: #0f0c09; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: 13px; color: var(--ink); min-height: 18px;
  }
  .balloon .muted { color: var(--muted); }
  .balloon .waiting { color: var(--warn); }

  /* decisions */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; padding: 14px;
  }
  .card .from { font-size: 12px; color: var(--muted); }
  .card .q { font-size: 15px; margin: 6px 0 10px; font-weight: 500; }
  .card ul { margin: 0; padding-left: 18px; color: var(--ink); }
  .card li { margin: 2px 0; }
  .card .ctx { font-size: 12px; color: var(--muted); margin-top: 10px; white-space: pre-wrap; }
  .card .urgency { float: right; font-size: 11px; text-transform: uppercase; color: var(--warn); }

  /* interactions */
  .chat { display: flex; flex-direction: column; gap: 8px; }
  .msg {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
    font-size: 13px;
  }
  .msg .who { color: var(--gold); font-weight: 600; }
  .msg .reply { color: var(--muted); margin-top: 4px; }

  .muted { color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1><span class="dot">◆</span> Tavern</h1>
  <div class="spacer"></div>
  <input id="token" type="password" placeholder="owner token (FRONTDESK_OWNER_TOKEN)" autocomplete="off">
</header>

<main>
  <section id="quest"></section>

  <div class="grid2">
    <div>
      <section id="party"><h2>Party</h2><div class="party"></div></section>
      <section id="decisions"><h2>Decisions</h2><div class="cards"></div></section>
    </div>
    <div>
      <section id="chat"><h2>At the table</h2><div class="chat"></div></section>
    </div>
  </div>
</main>

<script>
"use strict";
const $ = (sel) => document.querySelector(sel);
const token = document.getElementById("token");
token.value = localStorage.getItem("tavernToken") || "";
token.addEventListener("change", () => localStorage.setItem("tavernToken", token.value.trim()));

// Render strictly via text nodes so a hireling's words can never inject markup.
function el(tag, text, cls) {
  const n = document.createElement(tag);
  if (text != null) n.textContent = text;
  if (cls) n.className = cls;
  return n;
}

async function api(path) {
  const h = {};
  if (token.value.trim()) h.Authorization = "Bearer " + token.value.trim();
  const res = await fetch(path, { headers: h });
  if (!res.ok) {
    if (res.status === 401) throw new Error("unauthorized");
    if (res.status === 404) throw new Error("missing");
    throw new Error("http " + res.status);
  }
  return res.json();
}

const HUE = (id) => {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return h % 360;
};

function sprite(id) {
  const d = el("div", id.charAt(0).toUpperCase(), "sprite");
  d.style.background = "hsl(" + HUE(id) + " 45% 62%)";
  return d;
}

function balloon(agent) {
  const t = agent.turn;
  if (!t) return el("div", "idle — waiting for work", "balloon muted");
  const b = el("div", null, "balloon");
  if (t.topic) b.appendChild(el("div", t.topic));
  if (t.step) b.appendChild(el("div", t.step, "muted"));
  if (t.result) b.appendChild(el("div", t.result, "muted"));
  if (t.waitingOnOwner) b.appendChild(el("div", "waiting on you: " + t.waitingOnOwner, "waiting"));
  if (!t.topic && !t.step && !t.result && !t.waitingOnOwner) b.appendChild(el("div", "with " + (t.with || "the owner"), "muted"));
  return b;
}

function renderStatus(s) {
  // Party
  const party = document.querySelector("#party .party");
  party.replaceChildren();
  if (!s.agents || !s.agents.length) {
    party.appendChild(el("div", "no hirelings in this tavern yet", "hint"));
  }
  for (const a of s.agents) {
    const card = el("div", null, "agent");
    const head = el("div", null, "head");
    head.appendChild(sprite(a.id));
    const name = el("div", null, "name");
    name.appendChild(el("div", a.id));
    if (a.pending) name.appendChild(el("div", a.pending + " command(s) waiting", "pending"));
    head.appendChild(name);
    card.appendChild(head);
    card.appendChild(balloon(a));
    party.appendChild(card);
  }

  // Decisions
  const cards = document.querySelector("#decisions .cards");
  cards.replaceChildren();
  if (!s.decisions || !s.decisions.length) {
    cards.appendChild(el("div", "no open decisions", "hint"));
  }
  for (const d of s.decisions) {
    const c = el("div", null, "card");
    if (d.urgency && d.urgency !== "normal") c.appendChild(el("span", d.urgency, "urgency"));
    c.appendChild(el("div", "from " + d.from, "from"));
    c.appendChild(el("div", d.question, "q"));
    const ul = el("ul");
    for (const o of d.options) ul.appendChild(el("li", o));
    c.appendChild(ul);
    if (d.context) c.appendChild(el("div", d.context, "ctx"));
    if (d.card) c.appendChild(el("div", "a yes grants: " + d.card, "ctx"));
    cards.appendChild(c);
  }

  // Interactions
  const chat = document.querySelector("#chat .chat");
  chat.replaceChildren();
  if (!s.interactions || !s.interactions.length) {
    chat.appendChild(el("div", "the table is quiet", "hint"));
  }
  for (const m of s.interactions) {
    const row = el("div", null, "msg");
    row.appendChild(el("span", m.from + " → " + m.to + ": ", "who"));
    row.appendChild(el("span", m.text));
    if (m.reply) row.appendChild(el("div", m.to + ": " + m.reply, "reply"));
    chat.appendChild(row);
  }
}

function renderQuest(q) {
  const box = $("#quest");
  const g = q.quest || q;
  box.replaceChildren();
  if (!g || !g.title) {
    box.appendChild(el("div", "no quest set yet — define one with PUT /goal or GOAL_TITLE", "hint"));
    return;
  }
  const c = el("div", null, "quest");
  const top = el("div", null, "top");
  top.appendChild(el("span", g.title, "title"));
  const pct = Math.max(0, Math.min(100, g.percent || 0));
  top.appendChild(el("span", pct.toFixed(1) + "%", "pct"));
  c.appendChild(top);
  const bar = el("div", null, "bar");
  const fill = el("div", null, "fill");
  fill.style.width = pct + "%";
  bar.appendChild(fill);
  c.appendChild(bar);
  const num = g.currency ? g.currency + " " : "";
  c.appendChild(el("div", num + (g.current || 0) + " / " + g.target, "num"));
  box.appendChild(c);
}

async function refresh() {
  const noToken = document.querySelector("#party .party") === null || !token.value.trim();
  if (!token.value.trim()) {
    document.querySelector("#party .party").replaceChildren(
      el("div", "paste the owner token above (FRONTDESK_OWNER_TOKEN from your .env) to see the party, balloons and decisions.", "hint"));
    document.querySelector("#decisions .cards").replaceChildren();
    document.querySelector("#chat .chat").replaceChildren();
    $("#quest").replaceChildren(el("div", "the quest needs the owner token too", "hint"));
    return;
  }
  try {
    const [s, q] = await Promise.all([api("/api/status"), api("/api/quest")]);
    renderStatus(s);
    renderQuest(q);
  } catch (e) {
    document.querySelector("#party .party").replaceChildren(el("div", "could not read the tavern: " + e.message, "hint"));
    document.querySelector("#decisions .cards").replaceChildren();
    document.querySelector("#chat .chat").replaceChildren();
    $("#quest").replaceChildren();
  }
}

token.addEventListener("change", refresh);
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
