name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [runtime, services/tavern-core, services/egress, services/tavern-mcp]
    # The Redis-backed stores (tasks, asks, autonomy, policy grants) test
    # against a real Redis; without REDIS_TEST_URL those tests skip.
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      GOTOOLCHAIN: local
      REDIS_TEST_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l ${{ matrix.module }})" || (gofmt -l ${{ matrix.module }}; exit 1)
      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: go
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: runtime, file: runtime/Dockerfile }
          - { name: tavern-core, file: services/tavern-core/Dockerfile }
          - { name: egress, file: services/egress/Dockerfile }
          - { name: ledger-writer, file: services/ledger-writer/Dockerfile }
          - { name: gbrain, file: services/gbrain/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -f ${{ matrix.image.file }} -t hireling/${{ matrix.image.name }}:ci .

  compose:
    name: Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config (every profile)
        env:
          DEEPSEEK_API_KEY: ci
          FRONTDESK_OWNER_TOKEN: ci
          FRONTDESK_AGENT_TOKEN: ci
        run: docker compose --profile full --profile test --profile brain --profile game config --quiet

  hygiene:
    name: Docs, scripts and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: relative links in markdown
        run: python3 scripts/check-links.py
      - name: shellcheck
        run: shellcheck scripts/init-env.sh scripts/preflight.sh scripts/preflight_test.sh scripts/selfhost-bundle-gate.sh scripts/selfhost-bundle-gate_test.sh scripts/pack-client.sh bin/tavern
      - name: preflight
        run: sh scripts/preflight_test.sh
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact --no-banner

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: every commit is signed off
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          missing=0
          for c in $(git rev-list --no-merges "$base..$head"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $c has no Signed-off-by line (git commit --amend -s)"
              missing=1
            fi
          done
          exit $missing

  # Temporary QA probe for #32: the exact actions/setup-node v7.1.0 pin with the
  # same inputs client-image.yml uses. Removed before this branch is deleted.
  setup-node-probe:
    name: QA setup-node v7.1.0 probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node (the #32 pin)
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: probe/package-lock.json
      - name: Prove the toolchain
        run: |
          node --version
          npm --version
          cd probe && npm ci
      - name: Report the resolved version
        run: echo "setup-node returned ${{ steps.node.outputs.node-version }} (cache-hit ${{ steps.node.outputs.cache-hit }})"
