# hireling-client image
#
# Data-only image of the self-host tavern client. Publishing is off.
# The publish job runs only when ALL of these are true:
#   1. Someone starts this workflow by hand (workflow_dispatch), and
#   2. they set the input `publish` to true (the default is false), and
#   3. the repository variable CLIENT_PUBLISH exists and equals `true`.
# That variable is not created by this file. A push does not run this workflow.
# This file does not create a secret. The job uses the built-in GITHUB_TOKEN.
#
# To enable publishing later (no workflow edit):
#   Settings → Secrets and variables → Actions → Variables
#   Name: CLIENT_PUBLISH    Value: true
#   Then: Actions → hireling-client image → Run workflow → publish = true.
# The digest of the published image replaces the placeholder in compose.yaml.

name: hireling-client image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GHCR. Ignored unless the repository variable CLIENT_PUBLISH is true."
        required: false
        type: boolean
        default: false
      playhireling_ref:
        description: "playhireling git ref to build. Default is main."
        required: false
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: hireling-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build hireling-client
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout hireling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout playhireling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Play-Hireling/playhireling
          ref: ${{ inputs.playhireling_ref }}
          path: playhireling
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playhireling/package-lock.json

      - name: Build the self-host client
        working-directory: playhireling
        run: npm ci && npm run build:selfhost

      - name: Gate the bundle
        run: ./scripts/selfhost-bundle-gate.sh playhireling/dist-selfhost --expect-audio

      - name: Assemble the image context
        run: |
          mkdir -p client-context/dist client-context/licenses
          cp -a playhireling/dist-selfhost/. client-context/dist/
          cp NOTICE LICENSE-CLIENT.md THIRD-PARTY.md client-context/licenses/
          cp client/Dockerfile client-context/Dockerfile
          ./scripts/selfhost-bundle-gate.sh client-context/licenses

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (do not push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: client-context
          file: client-context/Dockerfile
          push: false
          load: true
          tags: hireling/client:ci
          build-args: |
            REVISION=${{ github.sha }}
          provenance: false
          sbom: false

  publish:
    name: Publish hireling-client
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && vars.CLIENT_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout hireling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout playhireling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Play-Hireling/playhireling
          ref: ${{ inputs.playhireling_ref }}
          path: playhireling
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playhireling/package-lock.json

      - name: Build the self-host client
        working-directory: playhireling
        run: npm ci && npm run build:selfhost

      - name: Gate the bundle
        run: ./scripts/selfhost-bundle-gate.sh playhireling/dist-selfhost --expect-audio

      - name: Assemble the image context
        run: |
          mkdir -p client-context/dist client-context/licenses
          cp -a playhireling/dist-selfhost/. client-context/dist/
          cp NOTICE LICENSE-CLIENT.md THIRD-PARTY.md client-context/licenses/
          cp client/Dockerfile client-context/Dockerfile
          ./scripts/selfhost-bundle-gate.sh client-context/licenses

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-client
          tags: |
            type=sha,prefix=sha-,format=short
          flavor: |
            latest=false

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: client-context
          file: client-context/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          name=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "ghcr.io/${name}-client@${DIGEST}"
