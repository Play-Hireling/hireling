# Release images
#
# Builds the images a tag would publish to GHCR:
#   ghcr.io/<owner>/hireling-runtime
#   ghcr.io/<owner>/hireling-tavern-core
#   ghcr.io/<owner>/hireling-egress
#   ghcr.io/<owner>/hireling-ledger-writer
#   ghcr.io/<owner>/hireling-gbrain
#
# Every image is a multi-arch manifest list (linux/amd64 + linux/arm64), carries
# SLSA provenance and an SBOM attestation, and is signed keyless with cosign by
# digest — the same pattern as .github/workflows/client-image.yml.
#
# Publishing is off. The publish job runs only when ALL of these are true:
#   1. Someone starts this workflow by hand (workflow_dispatch), and
#   2. they set the input `publish` to true (the default is false), and
#   3. the repository variable RELEASE_PUBLISH exists and equals `true`.
# That variable is not created by this file. A push of a v* tag only builds.
#
# A manual run from a branch publishes only the `sha-` tag, which is how the
# multi-arch manifest and the signature are tested without a release version.
# The `<tag>`/`v*` tag is only produced by a tag ref (type=ref,event=tag), and
# `latest` is never produced.
#
# To enable publishing later (no workflow edit):
#   Settings → Secrets and variables → Actions → Variables
#   Name: RELEASE_PUBLISH    Value: true
#   Then: Actions → Release images → Run workflow → publish = true.
# Do not put a token in that variable. The job uses the built-in GITHUB_TOKEN,
# and only that job has packages: write. `id-token: write` is what lets cosign
# prove the run identity without a stored key.

name: Release images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GHCR. Ignored unless the repository variable RELEASE_PUBLISH is true."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: runtime, file: runtime/Dockerfile }
          - { name: tavern-core, file: services/tavern-core/Dockerfile }
          - { name: egress, file: services/egress/Dockerfile }
          - { name: ledger-writer, file: services/ledger-writer/Dockerfile }
          - { name: gbrain, file: services/gbrain/Dockerfile }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 is emulated: every Dockerfile runs its compiler inside the image,
      # so the build needs the binfmt handlers from QEMU, not just Go's
      # cross-compile. Warm the cache here so the publish job does not repeat it.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
          flavor: |
            latest=false

      # No `load: true`: a manifest list cannot be loaded into the local engine.
      # This step is the "both architectures compile" gate; the publish job
      # builds the same targets again from the cache and pushes them.
      - name: Build (both platforms, do not push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  publish:
    name: Publish ${{ matrix.image.name }}
    needs: build
    # All three gates. vars.RELEASE_PUBLISH is unset until a maintainer creates
    # it, so this job does not run on a tag push or on a manual run today.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && vars.RELEASE_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # keyless cosign: the OIDC token is the identity, nothing is stored.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: runtime, file: runtime/Dockerfile }
          - { name: tavern-core, file: services/tavern-core/Dockerfile }
          - { name: egress, file: services/egress/Dockerfile }
          - { name: ledger-writer, file: services/ledger-writer/Dockerfile }
          - { name: gbrain, file: services/gbrain/Dockerfile }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
          flavor: |
            latest=false

      - name: Build and push (manifest list)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image.name }}

      # v4.1.3 is the installer that knows the cosign v3 asset layout: the v3
      # releases ship .sigstore.json bundles and a release-cosign.pub, not the
      # legacy .sig/.pem pair, so the pinned v3.8.1 installer fails here with
      # "Fetched public key does not match" (curl 22 on the .sig download).
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      # Signs the manifest list, by digest: the tag can be moved, the digest
      # cannot. Same command as the client image.
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          name=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "ghcr.io/${name}-${{ matrix.image.name }}@${DIGEST}"

      # The run log is the evidence: the two platforms, the attestations, and a
      # signature that verifies against this workflow's own identity.
      - name: Verify the manifest list and the signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          name=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          ref="ghcr.io/${name}-${{ matrix.image.name }}@${DIGEST}"
          docker buildx imagetools inspect "$ref"
          cosign verify "$ref" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
